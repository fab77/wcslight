name: wcslight CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test and verify package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Show environment
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run